apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: projects-dev-only
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - app: app-1
            cluster: k8s-dev
          - app: app-2
            cluster: k8s-dev
  template:
    metadata:
      name: '{{.app}}-{{.cluster}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/kblv511/argo-demo-repo.git
        targetRevision: application
        path: '{{.app}}/{{.cluster}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.app}}-{{.cluster}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true